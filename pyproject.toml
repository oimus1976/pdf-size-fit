[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-size-fit"
version = "0.0.0"
description = "Experimental offline routing PoC for fitting oversized PDFs under attachment limits"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5,<6",
  "pypdfium2>=4,<5",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "reportlab>=4,<5",
]

[project.scripts]
pdf-size-fit-diagnose = "pdf_size_fit.cli:main"
pdf-size-fit-image = "pdf_size_fit.image_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
